services:
  postgres:
    image: postgres:16
    container_name: lab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con un Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
